<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap');
  :root{
    --ink:#1c1a17; --parchment:#f0ede1; --parchment-dk:#e2ddc9;
    --rule:#c3bb9f; --brick:#9b3b2e; --forest:#2f4a34; --gold:#b8863a;
    --accent:var(--brick);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Space Mono',monospace;
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,.05) 1px, transparent 0);
    background-size:22px 22px;}

  /* --- top masthead --- */
  header{padding:30px 40px 0;border-bottom:3px double var(--ink)}
  .masthead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;padding-bottom:16px}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:2.2rem;margin:0;letter-spacing:-.5px}
  h1 span{color:var(--accent);transition:color .2s}
  .sub{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#6b6350}

  /* --- nav bar --- */
  nav{display:flex;gap:0;margin-top:6px}
  nav button{flex:0 0 auto;background:none;border:none;border-bottom:3px solid transparent;
    font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;text-transform:uppercase;
    letter-spacing:.1em;padding:12px 22px;cursor:pointer;color:#8a806a}
  nav button.active{color:var(--ink);border-bottom-color:var(--accent)}
  nav button:hover{color:var(--ink)}

  main{max-width:1180px;margin:0 auto;padding:28px 40px 96px}
  .section{display:none}
  .section.active{display:block}

  .bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  input,select,button{font-family:'Space Mono',monospace;font-size:.85rem}
  .url-box{flex:1;min-width:260px;display:flex;gap:8px;align-items:center;background:var(--parchment-dk);
    border:1px solid var(--rule);padding:8px 12px}
  .url-box label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#6b6350;white-space:nowrap}
  .url-box input{flex:1;border:none;background:transparent;outline:none;color:var(--ink)}
  .search-box{flex:0 0 auto;min-width:220px}
  .search-box input{min-width:170px}
  .search-box select{border:none;background:transparent;color:var(--ink);outline:none}
  .btn{background:var(--accent);color:#fdf6e8;border:none;padding:10px 20px;cursor:pointer;
    font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .btn:active{transform:translate(0,0);box-shadow:1px 1px 0 var(--ink)}
  .btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1.5px solid var(--accent)}
  /* --- write-problem banner --- */
  #warnBar{display:flex;align-items:flex-start;gap:12px;margin:0 0 18px;padding:10px 14px;
    background:#fbeae6;border:1.5px solid var(--brick);color:var(--brick);font-size:.78rem;font-weight:700}
  #warnBar[hidden]{display:none}
  #warnBar span{flex:1}
  #warnBar button{background:none;border:none;color:var(--brick);cursor:pointer;font-size:1rem;line-height:1}
  /* --- sync status pill (bottom-right corner) --- */
  #syncPill{position:fixed;right:16px;bottom:max(16px, env(safe-area-inset-bottom));z-index:50;
    display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--parchment-dk);
    border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);color:var(--ink);
    font-family:'Space Mono',monospace;font-size:.7rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;cursor:default;user-select:none}
  #syncPill .dot{width:10px;height:10px;border-radius:50%;background:var(--forest);flex:0 0 auto}
  #syncPill small{font-weight:400;color:#6b6350;text-transform:none;letter-spacing:0}
  #syncPill.syncing .dot{background:transparent;border:2px solid var(--rule);border-top-color:var(--accent);
    animation:spin .7s linear infinite}
  #syncPill.error{color:var(--brick);cursor:pointer}
  #syncPill.error .dot{background:var(--brick)}
  .btn:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:none}
  .btn.small{padding:6px 12px;font-size:.65rem;box-shadow:2px 2px 0 var(--ink)}

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;min-width:640px;border-collapse:collapse;background:#fffdf6;box-shadow:0 4px 0 var(--rule)}
  thead th{background:var(--ink);color:var(--parchment);text-align:left;padding:10px 12px;
    font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:400}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--rule);font-size:.82rem}
  tbody tr:hover{background:#f7f1de}
  tbody td[contenteditable="true"]{cursor:text}
  tbody td[contenteditable="true"]:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#fffbe8}
  select.role{border:1px solid var(--rule);background:#fff;padding:4px 6px}
  .pill{display:inline-block;padding:2px 8px;border:1px solid var(--gold);color:var(--gold);font-size:.68rem;text-transform:uppercase}
  .empty{padding:40px;text-align:center;color:#8a806a}
  .empty.error-msg{color:var(--brick);font-weight:700;letter-spacing:.04em}
  .spinner{display:inline-block;width:18px;height:18px;border:3px solid var(--rule);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{font-size:.72rem;margin-left:auto;color:#6b6350}

  /* --- row edit / delete icons --- */
  tbody td[data-field]{cursor:default}
  tbody td[data-field][contenteditable="true"]{cursor:text;background:#fffbe8}
  tbody td[data-field][contenteditable="true"]:focus{outline:2px solid var(--gold);outline-offset:-2px}
  select.role:disabled,input.status-tick:disabled{opacity:.55;cursor:default}
  .actions-cell{white-space:nowrap;text-align:center}
  .icon-btn{background:transparent;border:none;cursor:pointer;padding:6px 8px;font-size:.85rem;
    color:#6b6350;transition:color .12s,transform .12s}
  .icon-btn:hover{color:var(--ink);transform:translateY(-1px)}
  .icon-btn.edit-btn:hover{color:var(--gold)}
  .icon-btn.delete-btn:hover{color:var(--brick)}
  tr.editing{background:#fffbe8}
  tr.row-loading .actions-cell .icon-btn{visibility:hidden}
  .fade-loader{display:inline-flex;gap:4px;align-items:center;justify-content:center}
  .fade-loader span{width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation:fadeDot 1s ease-in-out infinite}
  .fade-loader span:nth-child(2){animation-delay:.15s}
  .fade-loader span:nth-child(3){animation-delay:.3s}
  @keyframes fadeDot{0%,80%,100%{opacity:.2}40%{opacity:1}}

  dialog{border:none;padding:0;background:transparent}
  dialog::backdrop{background:rgba(28,26,23,.55)}
  .modal{background:var(--parchment);border:3px double var(--ink);padding:30px;width:min(560px,92vw)}
  .modal h2{font-family:'Fraunces',serif;margin:0 0 18px;font-size:1.4rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field.full{grid-column:1/-1}
  .field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#6b6350}
  .field input,.field select{padding:8px 10px;border:1px solid var(--rule);background:#fffdf6;color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}


  @media (max-width: 640px){
    header{padding:20px 16px 0}
    .masthead{align-items:flex-start;gap:10px}
    h1{font-size:1.5rem}
    .sub{font-size:.62rem}
    #primaryAction{width:100%;text-align:center;padding:12px 16px}
    nav{overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0;margin-top:2px}
    nav button{padding:10px 14px;font-size:.7rem;white-space:nowrap;flex:none}
    main{padding:16px 16px 84px}
    .bar{gap:8px;margin-bottom:14px}
    .bar .btn{padding:8px 14px;font-size:.68rem}
    .status{width:100%;order:1;font-size:.68rem}
    table{min-width:560px}
    thead th{padding:8px 8px;font-size:.6rem}
    tbody td{padding:7px 8px;font-size:.72rem}
    .modal{padding:20px;width:94vw;max-height:88vh;overflow-y:auto}
    .modal h2{font-size:1.15rem}
    .grid{grid-template-columns:1fr;gap:8px}
    .field{margin-bottom:6px}
    .modal-actions{flex-direction:column-reverse}
    .modal-actions .btn{width:100%;text-align:center}
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <div><h1 id="pageTitle">The <span id="pageAccent">Student</span> Register</h1>
      <div class="sub" id="pageSub">Admission &amp; batch ledger</div></div>
    <button class="btn" id="primaryAction" onclick="openRegisterStudentPage()">+ Register Student</button>
  </div>
  <nav>
    <button class="active" data-tab="student" onclick="switchTab('student')">Students</button>
    <button data-tab="teacher" onclick="switchTab('teacher')">Teachers</button>
  </nav>
</header>

<main>

  <div id="warnBar" hidden role="alert"><span id="warnText"></span><button type="button" onclick="hideWarn_()" title="Dismiss">✕</button></div>

  <!-- ================= STUDENT SECTION ================= -->
  <section class="section active" id="section-student">
    <div class="bar">
      <button class="btn ghost" id="studentRefreshBtn" type="button" onclick="loadStudents(false)">Refresh</button>
      <div class="url-box search-box">
        <select id="studentSearchField" onchange="filterStudents()">
          <option value="*">All fields</option>
          <option value="Student Name">Name</option>
          <option value="Student ID">ID</option>
          <option value="Student Contact No">Phone</option>
          <option value="Guardian Name">Guardian</option>
          <option value="Class">Class</option>
          <option value="Batch">Batch</option>
          <option value="Board">Board</option>
          <option value="Subjects">Subjects</option>
        </select>
        <input id="studentSearchInput" type="search" placeholder="Search… (% = wildcard)" autocomplete="off" oninput="filterStudents()">
      </div>
      <span class="status" id="studentStatus"></span>
    </div>

    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>ID</th><th>Admission</th><th>Name</th><th>Phone</th><th>Guardian</th>
        <th>Class</th><th>Batch</th><th>Board</th><th>Subjects</th><th>Fee</th><th></th>
      </tr></thead>
      <tbody id="studentRows"><tr><td colspan="11" class="empty">Enter your Student Web App URL above and hit Refresh.</td></tr></tbody>
    </table>
    </div>
  </section>

  <!-- ================= TEACHER SECTION ================= -->
  <section class="section" id="section-teacher">
    <div class="bar">
      <button class="btn ghost" id="teacherRefreshBtn" type="button" onclick="loadTeachers(false)">Refresh</button>
      <div class="url-box search-box">
        <select id="teacherSearchField" onchange="filterTeachers()">
          <option value="*">All fields</option>
          <option value="Name">Name</option>
          <option value="Teacher_ID">ID</option>
          <option value="Phone">Phone</option>
          <option value="Email">Email</option>
          <option value="Role">Role</option>
          <option value="Subject1">Subject</option>
        </select>
        <input id="teacherSearchInput" type="search" placeholder="Search… (% = wildcard)" autocomplete="off" oninput="filterTeachers()">
      </div>
      <span class="status" id="teacherStatus"></span>
    </div>

    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th>
        <th>Subject</th><th>Active</th><th></th>
      </tr></thead>
      <tbody id="teacherRows"><tr><td colspan="8" class="empty">Enter your Teacher Web App URL above and hit Refresh.</td></tr></tbody>
    </table>
    </div>

  </section>

</main>

<!-- Add Teacher modal -->
<dialog id="teacherModal">
  <form class="modal" method="dialog" onsubmit="return false">
    <h2>Add a Teacher</h2>
    <div class="grid">
      <div class="field full"><label>Name</label><input id="t-Name" required></div>
      <div class="field"><label>Email</label><input id="t-Email" type="email"></div>
      <div class="field"><label>Phone</label><input id="t-Phone"></div>
      <div class="field"><label>Role</label>
        <select id="t-Role"><option>Teacher</option><option>Admin</option></select></div>
      <div class="field"><label>Subject</label><input id="t-Subject1"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" type="button" onclick="document.getElementById('teacherModal').close()">Cancel</button>
      <button class="btn" type="button" onclick="submitAddTeacher()">Save Teacher</button>
    </div>
  </form>
</dialog>

<button type="button" id="syncPill" class="syncing" role="status" aria-live="polite" onclick="syncRetry_()">
  <span class="dot"></span><span id="syncText">Syncing…</span>
</button>

<script>

  const STUDENT_API_URL = 'https://script.google.com/macros/s/AKfycbyqIYNC04_sjYMQ1rAXXXrBRuRDWpRLTV80UU8z4eYd0tgGlokVbxMtOaF-urv7AB2D/exec';
  const TEACHER_API_URL = 'https://script.google.com/macros/s/AKfycbyQd0Wx8FYNvKNqNL05Zr2M_GqWXtELVzyWHJK1nws3lgR267dAC5FiXKlHfKxvtHHY/exec';
 

  function isValidUrl_(u){ return typeof u === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u); }

  function showLoading_(tbodyId, colspan){
    document.getElementById(tbodyId).innerHTML =
      `<tr><td colspan="${colspan}" class="empty"><span class="spinner"></span></td></tr>`;
  }
  function showTableError_(tbodyId, colspan, msg){
    document.getElementById(tbodyId).innerHTML =
      `<tr><td colspan="${colspan}" class="empty error-msg">${msg}</td></tr>`;
  }
  function classifyError_(err, res){
    if (res && !res.ok) return `Server error (${res.status})`;
    if (err instanceof TypeError) return 'Network error';
    return 'Server error';
  }

  /* ---------- shared nav ---------- */
  function switchTab(tab){
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('section-'+tab).classList.add('active');
    const root = document.documentElement.style;
    if(tab==='student'){
      root.setProperty('--accent','var(--brick)');
      document.getElementById('pageAccent').textContent='Student';
      document.getElementById('pageSub').textContent='Admission & batch ledger';
      document.getElementById('primaryAction').textContent='+ Register Student';
      document.getElementById('primaryAction').onclick=openRegisterStudentPage;
      // No re-fetch here: data is cached in memory/localStorage and kept
      // fresh by the background poller, so switching tabs is instant.
    } else {
      root.setProperty('--accent','var(--forest)');
      document.getElementById('pageAccent').textContent='Teacher';
      document.getElementById('pageSub').textContent='Staff, roles & subject charge';
      document.getElementById('primaryAction').textContent='+ Add Teacher';
      document.getElementById('primaryAction').onclick=openTeacherModal;
    }
  }

  /* Student registration lives in its own file — put register-student.html
     next to this file (or change the path below) and this opens it in a
     new tab. */
  function openRegisterStudentPage(){
    window.open('register-student.html', '_blank');
  }
  function openTeacherModal(){ document.getElementById('teacherModal').showModal(); }

  /* ---------- local cache helpers ---------- */
  function cacheSave_(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage full/unavailable, ignore */ }
  }
  function cacheLoad_(key){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  }

  /* Keeps a loader running until a write shows up when re-read from the sheet
     (not just applied optimistically in memory). Polls the list endpoint,
     calling checkFn(list) each time, until it returns truthy or tries run out. */
  async function waitUntilSynced_(fetchListFn, checkFn, {tries=12, delay=700}={}){
    for(let i=0;i<tries;i++){
      try{
        const list = await fetchListFn();
        if(checkFn(list)) return {ok:true, list};
      }catch(e){ /* keep polling */ }
      await new Promise(r=>setTimeout(r, delay));
    }
    return {ok:false, list:null};
  }

  /* ---------- shared search: SQL  WHERE col LIKE '%term%'  style ----------
     - case-insensitive substring match (LIKE '%q%')
     - several words = AND  (every word must match)
     - field "All fields" = any column matches (col1 LIKE .. OR col2 LIKE ..)
     - % or * inside a word = wildcard, e.g.  "ra%ul"  "STU*07"
     - spaces / - . ( ) _ ignored, so "98765 43210" finds 9876543210
     - column lookup is trim/case-insensitive, so sheet header typos don't break it */
  const norm_    = v => String(v == null ? '' : v).toLowerCase().trim();
  const compact_ = v => norm_(v).replace(/[\s\-.()_,]/g, '');
  const esc_     = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function termMatches_(term, text){
    if(/[%*]/.test(term)){
      const re = term.split(/[%*]+/).map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*');
      return new RegExp(re, 'i').test(text);
    }
    if(text.includes(term)) return true;
    const ct = compact_(term);
    return ct.length > 0 && compact_(text).includes(ct);
  }

  function searchList_(list, field, query, cellText){
    const terms = norm_(query).split(/\s+/).filter(Boolean);
    if(!terms.length) return list;
    const want = norm_(field);
    return list.filter(row => {
      const keys = Object.keys(row);
      const cols = (field === '*' || !field) ? keys : keys.filter(k => norm_(k) === want);
      if(!cols.length) return false;
      const texts = cols.map(k => norm_(cellText(k, row[k])));
      return terms.every(t => texts.some(tx => termMatches_(t, tx)));
    });
  }

  /* ---------- shared refresh helpers ---------- */
  /* true while a row is being edited or saved/deleted. Refreshing then would
     re-render the table and wipe the open row, so auto-polls skip and a manual
     refresh asks the user to finish first. */
  function rowBusy_(tbodyId){
    return !!document.querySelector(`#${tbodyId} tr.editing, #${tbodyId} tr.row-loading`);
  }
  function setRefreshBtn_(id, busy){
    const b = document.getElementById(id);
    b.disabled = busy;
    b.textContent = busy ? 'Refreshing…' : 'Refresh';
  }

  /* ---------- sync status pill ----------
     Syncing…            → any load / save / delete / add in flight
     Sync completed      → everything read or written and confirmed by the sheet
     Not synced          → last attempt failed or write unconfirmed (click = retry)
     Background polls stay quiet (no flashing) unless they fail or it's the first sync. */
  let syncPending_ = 0, lastSync_ = null;
  const syncErr_ = {student:false, teacher:false};
  const syncedOnce_ = {student:false, teacher:false};

  function syncRender_(){
    const pill = document.getElementById('syncPill');
    const text = document.getElementById('syncText');
    const need = [['student',STUDENT_API_URL],['teacher',TEACHER_API_URL]]
      .filter(([k,u]) => isValidUrl_(u)).map(x => x[0]);
    let state, html;
    if(syncPending_ > 0){
      state = 'syncing'; html = 'Syncing…';
    } else if(syncErr_.student || syncErr_.teacher || !need.length || !need.every(k => syncedOnce_[k])){
      state = 'error'; html = 'Not synced <small>· click to retry</small>';
    } else {
      const t = lastSync_ ? new Date(lastSync_).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
      state = 'done'; html = 'Sync completed' + (t ? ` <small>· ${t}</small>` : '');
    }
    pill.className = state;
    text.innerHTML = html;
    pill.title = state === 'error' ? 'Click to retry' : '';
  }
  function syncBegin_(){ syncPending_++; syncRender_(); }
  /* counted=false → quiet background poll that never called syncBegin_ */
  function syncEnd_(key, ok, counted){
    if(counted) syncPending_ = Math.max(0, syncPending_ - 1);
    syncErr_[key] = !ok;
    if(ok){ syncedOnce_[key] = true; lastSync_ = Date.now(); }
    syncRender_();
  }
  function syncRetry_(){
    if(syncPending_ > 0) return;
    if(syncErr_.student || !syncedOnce_.student) loadStudents(false);
    if(syncErr_.teacher || !syncedOnce_.teacher) loadTeachers(false);
  }

  /* ---------- optimistic writes ----------
     Edit / delete change the screen + local cache INSTANTLY. The request to the
     sheet then runs in the background (sync pill shows progress). If it fails the
     change is rolled back. While any write is in flight, polls / manual refresh
     for that section are held off so they can't overwrite the local change with
     stale sheet data. Rows are found by ID (data-id), never by array position. */
  const inflight_ = {student:0, teacher:0};

  function rowFor_(tbodyId, id){
    return [...document.querySelectorAll(`#${tbodyId} tr[data-id]`)].find(r => r.dataset.id === String(id));
  }

  let warnTimer_ = null;
  function showWarn_(msg){
    document.getElementById('warnText').textContent = msg;
    document.getElementById('warnBar').hidden = false;
    clearTimeout(warnTimer_);
    warnTimer_ = setTimeout(hideWarn_, 20000);
  }
  function hideWarn_(){ document.getElementById('warnBar').hidden = true; }

  async function runWrite_(sec, o){
    const cfg = sec === 'student'
      ? {url:STUDENT_API_URL, fetchList:fetchStudentList_, status:setStudentStatus, reload:() => loadStudents(true)}
      : {url:TEACHER_API_URL, fetchList:fetchTeacherList_, status:setTeacherStatus, reload:() => loadTeachers(true)};
    inflight_[sec]++; syncBegin_();
    let syncOk = false, snapBack = false;
    cfg.status(o.label);
    try{
      const res = await fetch(cfg.url, {method:'POST', body: JSON.stringify(o.post)});
      if(res && res.ok === false) throw new Error('HTTP ' + res.status);
      // Apps Script can answer {success:true} / {success:false, error:"…"}.
      // Use that when present; if the answer is unreadable, fall back to re-reading the sheet.
      let out = null;
      try{ out = await res.clone().json(); }catch(e){ /* unreadable */ }
      if(out && (out.success === false || out.ok === false || out.error)){
        throw new Error(String(out.error || out.message || 'server rejected the change'));
      }
      let ok = !!(out && (out.success === true || out.ok === true));
      if(!ok) ({ok} = await waitUntilSynced_(cfg.fetchList, o.confirm));
      syncOk = ok;
      cfg.status(ok ? o.okMsg : o.unconfirmedMsg);
      if(!ok){ snapBack = true; showWarn_(o.unconfirmedMsg + ' The screen will now reload from the sheet.'); }
    }catch(err){
      o.rollback();
      const why = err && err.message ? err.message : 'unknown error';
      cfg.status(o.failMsg);
      showWarn_(o.failMsg + ' — ' + why);
    }finally{
      inflight_[sec]--;
      syncEnd_(sec, syncOk, true);
      if(snapBack) cfg.reload();        // show what the sheet really holds
    }
  }

  /* ---------- STUDENT ---------- */
  let STUDENTS = cacheLoad_('cache_students') || [];
  function setStudentStatus(msg){ document.getElementById('studentStatus').textContent = msg; }

  let studentLoading_ = false;
  async function loadStudents(silent){
    if(studentLoading_) return;                       // no overlapping requests
    if(!isValidUrl_(STUDENT_API_URL)){
      if(!silent){ showTableError_('studentRows', 11, 'Invalid URL'); }
      setStudentStatus('');
      return;
    }
    if(rowBusy_('studentRows') || inflight_.student){
      if(!silent) setStudentStatus(inflight_.student ? 'Saving… refresh in a moment' : 'Finish editing first');
      return;
    }
    studentLoading_ = true;
    const track = !silent || !syncedOnce_.student;   // show "Syncing…" for manual + first load
    if(track) syncBegin_();
    let syncOk = false;
    if(!silent){
      setRefreshBtn_('studentRefreshBtn', true);
      setStudentStatus('Refreshing…');
      if(!STUDENTS.length) showLoading_('studentRows', 11);
    }
    let res;
    try{
      // _=timestamp busts any browser/proxy cache so Refresh really re-reads the sheet
      res = await fetch(STUDENT_API_URL + '?action=listStudents&_=' + Date.now());
      if(!res.ok) throw new Error('server');
      const data = await res.json();
      syncOk = true;
      // user may have opened a row for edit while the request was in flight —
      // swapping the list now would shift row indexes under them, so drop it.
      if(rowBusy_('studentRows') || inflight_.student){ if(!silent) setStudentStatus('Saving… refresh in a moment'); return; }
      STUDENTS = data.students || [];
      cacheSave_('cache_students', STUDENTS);
      filterStudents(); // re-renders + sets count, respecting an active search
    }catch(err){
      // silent (auto-poll) failures keep the last good table on screen.
      // manual refresh: show the reason in the status, and an error row if nothing cached.
      if(!silent && !STUDENTS.length){ showTableError_('studentRows', 11, classifyError_(err, res)); }
      setStudentStatus(silent ? 'Refresh failed' : 'Refresh failed — ' + classifyError_(err, res));
    }finally{
      studentLoading_ = false;
      syncEnd_('student', syncOk, track);
      if(!silent) setRefreshBtn_('studentRefreshBtn', false);
    }
  }

  const cell_ = v => esc_(v == null ? '' : v);

  function renderStudentRows(list, emptyMsg){
    list = list || STUDENTS;
    const body = document.getElementById('studentRows');
    if(!list.length){ body.innerHTML = `<tr><td colspan="11" class="empty">${emptyMsg || 'No students yet.'}</td></tr>`; return; }
    body.innerHTML = [...list].reverse().map(s => `
      <tr data-id="${esc_(s['Student ID']||'')}">
        <td>${cell_(s['Student ID'])}</td>
        <td data-field="Admission Date" contenteditable="false">${cell_(fmtDate(s['Admission Date']))}</td>
        <td data-field="Student Name" contenteditable="false">${cell_(s['Student Name'])}</td>
        <td data-field="Student Contact No" contenteditable="false">${cell_(s['Student Contact No'])}</td>
        <td data-field="Guardian Name" contenteditable="false">${cell_(s['Guardian Name'])}</td>
        <td data-field="Class" contenteditable="false">${cell_(s['Class'])}</td>
        <td data-field="Batch" contenteditable="false">${cell_(s['Batch'])}</td>
        <td data-field="Board" contenteditable="false">${cell_(s['Board'])}</td>
        <td data-field="Subjects" contenteditable="false">${cell_(s['Subjects'])}</td>
        <td data-field="Monthly Fee" contenteditable="false">${cell_(s['Monthly Fee'])}</td>
        <td class="actions-cell">
          <button class="icon-btn edit-btn" title="Edit" onclick="toggleEditStudentRow(this)"><i class="fa-solid fa-pen"></i></button>
          <button class="icon-btn delete-btn" title="Delete" onclick="deleteStudentRow(this)"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>`).join('');
  }

  function filterStudents(){
    const field = document.getElementById('studentSearchField').value;
    const q = document.getElementById('studentSearchInput').value.trim();
    if(!q){ renderStudentRows(STUDENTS); setStudentStatus(`${STUDENTS.length} students`); return; }
    const hits = searchList_(STUDENTS, field, q,
      (k, v) => norm_(k) === 'admission date' ? fmtDate(v) : v);
    renderStudentRows(hits, `No student matches “${esc_(q)}”.`);
    setStudentStatus(`${hits.length} of ${STUDENTS.length} students`);
  }
  function fmtDate(v){
    if(!v) return '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(v))) return String(v);       // already a plain date
    const d = new Date(v);                                              // old-style timestamp: use LOCAL day
    if(isNaN(d)) return v;
    const p = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }

  async function fetchStudentList_(){
    const res = await fetch(STUDENT_API_URL + '?action=listStudents&_=' + Date.now());
    if(!res.ok) throw new Error('server');
    const data = await res.json();
    return data.students || [];
  }

  const studentIdx_ = id => STUDENTS.findIndex(x => String(x['Student ID']) === String(id));

  function toggleEditStudentRow(btn){
    const tr = btn.closest('tr');
    if(!tr) return;
    if(tr.classList.contains('editing')) saveStudentRow(tr);
    else enterEditMode_(tr);
  }

  function saveStudentRow(tr){
    const id = tr.dataset.id;
    const i = studentIdx_(id);
    if(i < 0) return;
    const g = f => tr.querySelector(`[data-field="${f}"]`).innerText.trim();
    if(!g('Student Name')){ showWarn_('Name cannot be empty.'); return; }
    if(g('Admission Date') && !/^\d{4}-\d{2}-\d{2}$/.test(g('Admission Date'))){
      showWarn_('Admission date must look like 2026-06-12 (YYYY-MM-DD).'); return;   // row stays open
    }
    const data = {
      'Student ID': STUDENTS[i]['Student ID'],
      'Admission Date': g('Admission Date'),
      'Student Name': g('Student Name'),
      'Student Contact No': g('Student Contact No'),
      'Guardian Name': g('Guardian Name'),
      'Class': g('Class'),
      'Batch': g('Batch'),
      'Board': g('Board'),
      'Subjects': g('Subjects'),
      'Monthly Fee': g('Monthly Fee')
    };
    const before = STUDENTS[i];
    STUDENTS[i] = {...before, ...data};          // instant local update
    cacheSave_('cache_students', STUDENTS);
    exitEditMode_(tr);                           // row already shows what was typed
    runWrite_('student', {
      label:'Saving…', post:{action:'updateStudent', data},
      confirm: list => list.some(x => String(x['Student ID'])===String(id) && String(x['Student Name']||'')===data['Student Name'] && String(x['Student Contact No']||'')===data['Student Contact No']),
      okMsg:'Saved ' + id, unconfirmedMsg:'Sheet did not confirm the edit of ' + id + ' (check Apps Script).',
      failMsg:'Save failed (reopened, press ✓ to retry)',
      rollback(){
        const j = studentIdx_(id);
        if(j >= 0) STUDENTS[j] = before;
        cacheSave_('cache_students', STUDENTS);
        const row = rowFor_('studentRows', id);
        if(row) enterEditMode_(row);             // keep typed values, let user retry
      }
    });
  }

  function deleteStudentRow(btn){
    const tr = btn.closest('tr');
    if(!tr) return;
    const id = tr.dataset.id;
    const i = studentIdx_(id);
    if(i < 0) return;
    const s = STUDENTS[i];
    if(!confirm(`Delete student ${s['Student Name']||s['Student ID']}? This can't be undone.`)) return;
    STUDENTS.splice(i, 1);                       // instant local delete
    cacheSave_('cache_students', STUDENTS);
    tr.remove();
    if(!document.querySelector('#studentRows tr[data-id]')) filterStudents();  // empty-state message
    runWrite_('student', {
      label:'Deleting…', post:{action:'deleteStudent', data:{'Student ID': s['Student ID']}},
      confirm: list => !list.some(x => x['Student ID']===s['Student ID']),
      okMsg:'Deleted ' + id, unconfirmedMsg:'Sheet did not confirm the delete of ' + id + ' (check Apps Script).',
      failMsg:'Delete failed (entry restored)',
      rollback(){
        STUDENTS.splice(Math.min(i, STUDENTS.length), 0, s);
        cacheSave_('cache_students', STUDENTS);
        if(!rowBusy_('studentRows')) filterStudents();
      }
    });
  }

  /* ---------- TEACHER ---------- */
  let TEACHERS = cacheLoad_('cache_teachers') || [];

  function setTeacherStatus(msg){ document.getElementById('teacherStatus').textContent = msg; }

  let teacherLoading_ = false;
  async function loadTeachers(silent){
    if(teacherLoading_) return;
    if(!isValidUrl_(TEACHER_API_URL)){
      if(!silent){ showTableError_('teacherRows', 8, 'Invalid URL'); }
      setTeacherStatus('');
      return;
    }
    if(rowBusy_('teacherRows') || inflight_.teacher){
      if(!silent) setTeacherStatus(inflight_.teacher ? 'Saving… refresh in a moment' : 'Finish editing first');
      return;
    }
    teacherLoading_ = true;
    const track = !silent || !syncedOnce_.teacher;
    if(track) syncBegin_();
    let syncOk = false;
    if(!silent){
      setRefreshBtn_('teacherRefreshBtn', true);
      setTeacherStatus('Refreshing…');
      if(!TEACHERS.length) showLoading_('teacherRows', 8);
    }
    let res;
    try{
      res = await fetch(TEACHER_API_URL + '?action=listTeachers&_=' + Date.now());
      if(!res.ok) throw new Error('server');
      const data = await res.json();
      syncOk = true;
      if(rowBusy_('teacherRows') || inflight_.teacher){ if(!silent) setTeacherStatus('Saving… refresh in a moment'); return; }
      TEACHERS = data.teachers || [];
      cacheSave_('cache_teachers', TEACHERS);
      filterTeachers(); // re-renders + sets count, respecting an active search
    }catch(err){
      if(!silent && !TEACHERS.length){ showTableError_('teacherRows', 8, classifyError_(err, res)); }
      setTeacherStatus(silent ? 'Refresh failed' : 'Refresh failed — ' + classifyError_(err, res));
    }finally{
      teacherLoading_ = false;
      syncEnd_('teacher', syncOk, track);
      if(!silent) setRefreshBtn_('teacherRefreshBtn', false);
    }
  }

  function renderTeacherRows(list, emptyMsg){
    list = list || TEACHERS;
    const body = document.getElementById('teacherRows');
    if(!list.length){ body.innerHTML = `<tr><td colspan="8" class="empty">${emptyMsg || 'No teachers yet.'}</td></tr>`; return; }
    body.innerHTML = [...list].reverse().map(t => `
      <tr data-id="${esc_(t.Teacher_ID||'')}">
        <td>${cell_(t.Teacher_ID)}</td>
        <td data-field="Name" contenteditable="false">${cell_(t.Name)}</td>
        <td data-field="Email" contenteditable="false">${cell_(t.Email)}</td>
        <td data-field="Phone" contenteditable="false">${cell_(t.Phone)}</td>
        <td>
          <select class="role" data-field="Role" disabled>
            <option ${t.Role==='Teacher'?'selected':''}>Teacher</option>
            <option ${t.Role==='Admin'?'selected':''}>Admin</option>
          </select>
        </td>
        <td data-field="Subject1" contenteditable="false">${cell_(t.Subject1)}</td>
        <td style="text-align:center">
          <input type="checkbox" class="status-tick" data-field="Status" disabled ${t.Status?'checked':''}>
        </td>
        <td class="actions-cell">
          <button class="icon-btn edit-btn" title="Edit" onclick="toggleEditTeacherRow(this)"><i class="fa-solid fa-pen"></i></button>
          <button class="icon-btn delete-btn" title="Delete" onclick="deleteTeacherRow(this)"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>`).join('');
  }

  function filterTeachers(){
    const field = document.getElementById('teacherSearchField').value;
    const q = document.getElementById('teacherSearchInput').value.trim();
    if(!q){ renderTeacherRows(TEACHERS); setTeacherStatus(`${TEACHERS.length} teachers`); return; }
    const hits = searchList_(TEACHERS, field, q, (k, v) => v);
    renderTeacherRows(hits, `No teacher matches “${esc_(q)}”.`);
    setTeacherStatus(`${hits.length} of ${TEACHERS.length} teachers`);
  }

  /* Flip a row between locked (display) and editable, or commit the edit. */
  const teacherIdx_ = id => TEACHERS.findIndex(x => String(x.Teacher_ID) === String(id));

  function toggleEditTeacherRow(btn){
    const tr = btn.closest('tr');
    if(!tr) return;
    if(tr.classList.contains('editing')) saveTeacherRow(tr);
    else enterEditMode_(tr);
  }

  function enterEditMode_(tr){
    tr.classList.add('editing');
    tr.querySelectorAll('[data-field]').forEach(el=>{
      if(el.tagName==='SELECT' || el.tagName==='INPUT'){ el.disabled=false; }
      else { el.contentEditable='true'; }
    });
    const btn = tr.querySelector('.edit-btn');
    btn.innerHTML = '<i class="fa-solid fa-check"></i>';
    btn.title = 'Save';
    const first = tr.querySelector('[data-field="Student Name"], [data-field=Name]'); // student rows have no plain "Name"
    if(first) first.focus();
  }

  function exitEditMode_(tr){
    tr.classList.remove('editing');
    tr.querySelectorAll('[data-field]').forEach(el=>{
      if(el.tagName==='SELECT' || el.tagName==='INPUT'){ el.disabled=true; }
      else { el.contentEditable='false'; }
    });
    const btn = tr.querySelector('.edit-btn');
    btn.innerHTML = '<i class="fa-solid fa-pen"></i>';
    btn.title = 'Edit';
  }

  function saveTeacherRow(tr){
    const id = tr.dataset.id;
    const i = teacherIdx_(id);
    if(i < 0) return;
    if(!tr.querySelector('[data-field=Name]').innerText.trim()){ showWarn_('Name cannot be empty.'); return; }
    const data = {
      Teacher_ID: TEACHERS[i].Teacher_ID,
      Name: tr.querySelector('[data-field=Name]').innerText.trim(),
      Email: tr.querySelector('[data-field=Email]').innerText.trim(),
      Phone: tr.querySelector('[data-field=Phone]').innerText.trim(),
      Role: tr.querySelector('[data-field=Role]').value,
      Subject1: tr.querySelector('[data-field=Subject1]').innerText.trim(),
      Status: tr.querySelector('[data-field=Status]').checked
    };
    const before = TEACHERS[i];
    TEACHERS[i] = {...before, ...data};          // instant local update
    cacheSave_('cache_teachers', TEACHERS);
    exitEditMode_(tr);
    runWrite_('teacher', {
      label:'Saving…', post:{action:'updateTeacher', data},
      confirm: list => list.some(x => String(x.Teacher_ID)===String(id) && String(x.Name||'')===data.Name && String(x.Phone||'')===data.Phone),
      okMsg:'Saved ' + id, unconfirmedMsg:'Sheet did not confirm the edit of ' + id + ' (check Apps Script).',
      failMsg:'Save failed (reopened, press ✓ to retry)',
      rollback(){
        const j = teacherIdx_(id);
        if(j >= 0) TEACHERS[j] = before;
        cacheSave_('cache_teachers', TEACHERS);
        const row = rowFor_('teacherRows', id);
        if(row) enterEditMode_(row);
      }
    });
  }

  async function fetchTeacherList_(){
    const res = await fetch(TEACHER_API_URL + '?action=listTeachers&_=' + Date.now());
    if(!res.ok) throw new Error('server');
    const data = await res.json();
    return data.teachers || [];
  }

  function deleteTeacherRow(btn){
    const tr = btn.closest('tr');
    if(!tr) return;
    const id = tr.dataset.id;
    const i = teacherIdx_(id);
    if(i < 0) return;
    const t = TEACHERS[i];
    if(!confirm(`Delete teacher ${t.Name||t.Teacher_ID}? This can't be undone.`)) return;
    TEACHERS.splice(i, 1);                       // instant local delete
    cacheSave_('cache_teachers', TEACHERS);
    tr.remove();
    if(!document.querySelector('#teacherRows tr[data-id]')) filterTeachers();
    runWrite_('teacher', {
      label:'Deleting…', post:{action:'deleteTeacher', data:{ Teacher_ID: t.Teacher_ID }},
      confirm: list => !list.some(x => x.Teacher_ID===t.Teacher_ID),
      okMsg:'Deleted ' + id, unconfirmedMsg:'Sheet did not confirm the delete of ' + id + ' (check Apps Script).',
      failMsg:'Delete failed (entry restored)',
      rollback(){
        TEACHERS.splice(Math.min(i, TEACHERS.length), 0, t);
        cacheSave_('cache_teachers', TEACHERS);
        if(!rowBusy_('teacherRows')) filterTeachers();
      }
    });
  }

  async function submitAddTeacher(){
    if(!isValidUrl_(TEACHER_API_URL)){ alert('TEACHER_API_URL is not set correctly — edit it at the top of the script.'); return; }
    const g = id => document.getElementById(id).value.trim();
    if(!g('t-Name')){ alert('Name required.'); return; }
    const payload = { action:'addTeacher', data:{
      Name:g('t-Name'), Email:g('t-Email'), Phone:g('t-Phone'),
      Role:g('t-Role'), Subject1:g('t-Subject1')
    }};
    const saveBtn = document.querySelector('#teacherModal .modal-actions .btn:not(.ghost)');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="fade-loader"><span></span><span></span><span></span></span> Saving…';
    setTeacherStatus('Saving…');
    inflight_.teacher++; syncBegin_();
    let syncOk = false, snapBack = false;
    try{
      const res = await fetch(TEACHER_API_URL, {method:'POST', body: JSON.stringify(payload)});
      if(res && res.ok === false) throw new Error('HTTP ' + res.status);
      let out = null;
      try{ out = await res.clone().json(); }catch(e){ /* unreadable */ }
      if(out && (out.success === false || out.ok === false || out.error)){
        throw new Error(String(out.error || out.message || 'server rejected the change'));
      }
      if(out && out.success === true && out.id){
        // sheet accepted it and told us the new ID → show the row right away
        TEACHERS = [...TEACHERS, {Teacher_ID: out.id, ...payload.data, Status: true}];
        syncOk = true;
      } else {
        // unreadable reply: fall back to waiting until the sheet shows the new teacher
        const {ok, list} = await waitUntilSynced_(fetchTeacherList_, list =>
          list.some(x => String(x.Name||'')===payload.data.Name && String(x.Phone||'')===payload.data.Phone)
        );
        syncOk = ok;
        if(ok) TEACHERS = list; else snapBack = true;
      }
      cacheSave_('cache_teachers', TEACHERS);
      filterTeachers();
      document.getElementById('teacherModal').close();
      ['t-Name','t-Email','t-Phone','t-Subject1'].forEach(id=>document.getElementById(id).value='');
      setTeacherStatus(syncOk ? 'Teacher added' : 'Added (sync unconfirmed)');
      if(snapBack) showWarn_('Sheet did not confirm the new teacher (check Apps Script). The screen will now reload from the sheet.');
    }catch(err){
      setTeacherStatus('Save failed');
      showWarn_('Add teacher failed — ' + (err && err.message ? err.message : 'unknown error'));
    }finally{
      inflight_.teacher--;
      saveBtn.disabled = false; saveBtn.innerHTML = 'Save Teacher';
      syncEnd_('teacher', syncOk, true);
      if(snapBack) loadTeachers(true);
    }
  }

  /* ---------- boot ---------- */
  if(STUDENTS.length) renderStudentRows(STUDENTS);   // instant paint from cache
  if(TEACHERS.length) renderTeacherRows();            // instant paint from cache
  if(isValidUrl_(STUDENT_API_URL)) loadStudents(!!STUDENTS.length);
  if(isValidUrl_(TEACHER_API_URL)) loadTeachers(!!TEACHERS.length);

  // auto-refresh every 15 s, paused while the tab is in the background
  // (Apps Script has a daily request quota - 5 s x 2 sheets would burn it)
  setInterval(()=>{
    if(document.hidden) return;
    if(isValidUrl_(STUDENT_API_URL)) loadStudents(true);
    if(isValidUrl_(TEACHER_API_URL)) loadTeachers(true);
  }, 15000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) return;                       // catch up as soon as the tab is opened again
    if(isValidUrl_(STUDENT_API_URL)) loadStudents(true);
    if(isValidUrl_(TEACHER_API_URL)) loadTeachers(true);
  });
</script>
</body>
</html>
