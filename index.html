<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Admission Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4ecdc;
    --paper-line:#d9c9a3;
    --ink:#2b241a;
    --ink-soft:#6b5f4a;
    --maroon:#7a2e2e;
    --maroon-deep:#5a1f1f;
    --gold:#b3862c;
    --ok:#2f6b4f;
    --card:#fffaf0;
    --shadow: 0 20px 50px -20px rgba(43,36,26,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Space Mono', monospace;
    color:var(--ink);
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 28px),
      var(--paper);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px 90px;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(circle at 1px 1px, rgba(43,36,26,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    pointer-events:none;
  }

  .sheet{
    width:100%;
    max-width:640px;
    background:var(--card);
    border:1px solid var(--paper-line);
    box-shadow:var(--shadow);
    position:relative;
    padding:50px 40px 40px;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:14px;left:14px;right:14px;bottom:14px;
    border:1px solid var(--gold);
    opacity:.35;
    pointer-events:none;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(24px);}
    to{opacity:1; transform:translateY(0);}
  }

  .stamp-wrap{
    position:absolute;
    top:26px; right:26px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .stamp{
    border:2px solid var(--maroon);
    color:var(--maroon);
    font-family:'Space Mono',monospace;
    font-size:9px;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:5px 9px;
    transform:rotate(6deg);
    opacity:.75;
    white-space:nowrap;
  }
  .stamp-date{
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    opacity:.7;
    white-space:nowrap;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin:0 84px 6px 0;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-optical-sizing:auto;
    font-size:clamp(26px, 6vw, 38px);
    margin:0 84px 4px 0;
    color:var(--maroon-deep);
    line-height:1.15;
    word-break:break-word;
  }
  .sub{
    color:var(--ink-soft);
    font-size:12.5px;
    line-height:1.6;
    margin:0 0 30px;
    border-bottom:1px dashed var(--paper-line);
    padding-bottom:22px;
  }

  form{ display:grid; gap:20px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  label{
    display:block;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:7px;
    font-weight:700;
  }
  .req{ color:var(--maroon); }

  .field{
    position:relative;
    display:flex;
    align-items:flex-end;
    gap:6px;
    border-bottom:2px solid var(--paper-line);
    transition:border-color .25s ease;
  }
  .field:focus-within{ border-bottom-color:var(--maroon); }
  input, select{
    width:100%;
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:none;
    padding:8px 2px 10px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    min-width:0;
  }
  select{ cursor:pointer; }
  input::placeholder{ color:#b9ac92; font-family:'Space Mono',monospace; font-size:13px;}
  .field::after{
    content:"";
    position:absolute; left:0; bottom:-2px;
    width:0; height:2px;
    background:var(--gold);
    transition:width .3s ease;
  }
  .field:focus-within::after{ width:100%; }

  .prefix{
    flex:0 0 auto;
    margin-bottom:9px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:.02em;
    color:var(--maroon);
    background:rgba(122,46,46,0.08);
    border:1px solid rgba(122,46,46,0.25);
    border-radius:4px;
    padding:3px 7px;
    line-height:1.4;
    pointer-events:none;
    white-space:nowrap;
  }
  .prefix.rupee{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:15px;
    padding:1px 8px 3px;
  }

  select{
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 8px) 50%;
    background-size: 6px 6px, 6px 6px;
    background-repeat:no-repeat;
    padding-right:26px;
  }
  input[type="date"]{ cursor:pointer; }
  input[type="date"]::-webkit-calendar-picker-indicator{
    filter: sepia(1) saturate(3) hue-rotate(315deg) opacity(.6);
  }

  .msel{ position:relative; }
  .msel-btn{
    all:unset;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    padding:8px 2px 10px;
    border-bottom:2px solid var(--paper-line);
    cursor:pointer;
    box-sizing:border-box;
  }
  .msel-btn:focus{ border-bottom-color:var(--maroon); }
  .msel-btn:hover, .msel-btn:active, .msel-btn:focus{
    background:transparent;
    color:var(--ink);
    font-weight:500;
    box-shadow:none;
    transform:none;
  }
  #subjectBtnText.placeholder{ color:#b9ac92; font-family:'Space Mono',monospace; font-size:13px; }
  .msel-arrow{
    width:7px; height:7px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    margin-bottom:3px;
    flex:0 0 auto;
  }
  .msel-panel{
    display:none;
    position:absolute;
    z-index:5;
    top:calc(100% + 6px);
    left:0; right:0;
    background:var(--card);
    border:1px solid var(--paper-line);
    box-shadow:var(--shadow);
    padding:8px;
  }
  .msel-panel.open{ display:block; }
  .msel-opt{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--ink);
    padding:9px 8px;
    cursor:pointer;
    text-transform:none;
    letter-spacing:0;
    margin-bottom:0;
    font-weight:400;
  }
  .msel-opt:hover{ background:rgba(122,46,46,0.06); }
  .msel-opt input{ all:revert; accent-color:var(--maroon); width:15px; height:15px; }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--maroon);
    background:rgba(122,46,46,0.08);
    border:1px solid rgba(122,46,46,0.25);
    border-radius:4px;
    padding:4px 8px;
  }
  .chip button{
    all:unset;
    cursor:pointer;
    font-weight:700;
    line-height:1;
    color:var(--maroon);
  }

  .actions{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  button{
    font-family:'Space Mono', monospace;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:12.5px;
    color:#fdf6e8;
    background:var(--maroon);
    border:none;
    padding:15px 28px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
    box-shadow:0 8px 0 var(--maroon-deep);
  }
  button:hover{ background:#8a3535; }
  button:active{ transform:translateY(6px); box-shadow:0 2px 0 var(--maroon-deep); }
  button:disabled{ opacity:.6; cursor:progress; }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinner{
    display:inline-block;
    width:13px; height:13px;
    border:2px solid rgba(253,246,232,0.35);
    border-top-color:#fdf6e8;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:-2px;
    margin-right:8px;
  }
  .spinner.dark{
    border-color:rgba(122,46,46,0.25);
    border-top-color:var(--maroon);
  }
  button .btn-label{ display:inline-flex; align-items:center; }

  form.is-saving{ position:relative; }
  form.is-saving::after{
    content:"";
    position:absolute;
    inset:-6px;
    background:rgba(244,236,220,0.45);
    cursor:progress;
    z-index:4;
  }
  form.is-saving .field,
  form.is-saving .msel-btn{ pointer-events:none; opacity:.7; }

  .status{
    font-size:12px;
    color:var(--ink-soft);
    min-height:16px;
  }
  .status.ok{ color:var(--ok); font-weight:700; }
  .status.err{ color:var(--maroon); font-weight:700; }

  .foot{
    margin-top:28px;
    padding-top:18px;
    border-top:1px dashed var(--paper-line);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#b9ac92;
  }
  .foot .partner{
    color:var(--gold);
    font-weight:700;
  }

  @media (max-width:520px){
    body{ padding:28px 0 60px; }
    .sheet{ padding:36px 22px 30px; max-width:100%; }
    .sheet::before{ top:10px; left:10px; right:10px; bottom:10px; }
    .stamp-wrap{ top:18px; right:18px; }
    .stamp{ font-size:8px; padding:4px 7px; }
    .stamp-date{ font-size:8px; }
    .foot{ flex-direction:column; align-items:flex-start; gap:4px; }
    .eyebrow, h1{ margin-right:70px; }
    h1{ font-size:26px; }
    .sub{ font-size:12px; margin-bottom:24px; }
    form{ gap:18px; }
    input, select{ font-size:16px; }
    .actions{ flex-direction:column; align-items:stretch; gap:10px; }
    button{ width:100%; padding:16px; }
    .status{ text-align:center; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="stamp-wrap">
    <div class="stamp">Original</div>
  </div>
  <p class="eyebrow">Admission Register</p>
  <h1>Student Enrollment Form</h1>
  <p class="sub">Fill every field carefully. Entry syncs directly to the register sheet on submit.</p>

  <form id="studentForm">
    <div>
      <label>Student ID <span class="req">*</span></label>
      <div class="field has-prefix">
        <span class="prefix" id="studentIdPrefix">ID</span>
        <input type="text" name="Student ID" id="studentIdInput" placeholder="PP 26 0001" pattern="PP\s?\d{2}\s?\d{4}" required>
      </div>
    </div>

    <div>
      <label>Admission Date <span class="req">*</span></label>
      <div class="field">
        <input type="date" name="Admission" required>
      </div>
    </div>

    <div>
      <label>Student Name <span class="req">*</span></label>
      <div class="field">
        <input type="text" name="Name" placeholder="Full name" required>
      </div>
    </div>

    <div>
      <label>Student Phone</label>
      <div class="field has-prefix">
        <span class="prefix">+91</span>
        <input type="tel" name="Student Phone" placeholder="98765 43210 (optional)" pattern="[0-9\s]{10,15}">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>Parent / Guardian <span class="req">*</span></label>
        <div class="field">
          <input type="text" name="Parent" placeholder="Guardian's name" required>
        </div>
      </div>
      <div>
        <label>Guardian Phone <span class="req">*</span></label>
        <div class="field has-prefix">
          <span class="prefix">+91</span>
          <input type="tel" name="Guardian Phone" placeholder="98765 43210" pattern="[0-9\s]{10,15}" required>
        </div>
      </div>
    </div>

    <div class="row2">
      <div>
        <label>Class <span class="req">*</span></label>
        <div class="field">
          <select name="Class" required>
            <option value="" disabled selected>Select class</option>
            <option>Class 6</option><option>Class 7</option><option>Class 8</option>
            <option>Class 9</option><option>Class 10</option>
            <option>Class 11 - Science</option><option>Class 12 - Science</option>
            <option>NEET Dropper</option>
          </select>
        </div>
      </div>
      <div>
        <label>Batch <span class="req">*</span></label>
        <div class="field">
          <select name="Batch" required>
            <option value="" disabled selected>Select batch</option>
            <option>Morning</option><option>Afternoon</option><option>Evening</option><option>Weekend</option>
          </select>
        </div>
      </div>
    </div>

    <div>
      <label>Subjects <span class="req">*</span></label>
      <div class="msel" id="subjectMsel">
        <button type="button" class="msel-btn" id="subjectBtn">
          <span id="subjectBtnText">Select subjects</span>
          <span class="msel-arrow"></span>
        </button>
        <div class="msel-panel" id="subjectPanel">
          <label class="msel-opt"><input type="checkbox" value="Physics"><span>Physics</span></label>
          <label class="msel-opt"><input type="checkbox" value="Chemistry"><span>Chemistry</span></label>
          <label class="msel-opt"><input type="checkbox" value="Biology - Botany"><span>Biology - Botany</span></label>
          <label class="msel-opt"><input type="checkbox" value="Biology - Zoology"><span>Biology - Zoology</span></label>
          <label class="msel-opt"><input type="checkbox" value="Mathematics"><span>Mathematics</span></label>
          <label class="msel-opt"><input type="checkbox" value="English"><span>English</span></label>
        </div>
      </div>
      <div class="chips" id="subjectChips"></div>
      <input type="hidden" name="Subjects" id="subjectsHidden">
    </div>

    <div>
      <label>Monthly Fee (₹) <span class="req">*</span></label>
      <div class="field has-prefix">
        <span class="prefix rupee">₹</span>
        <input type="number" name="Monthly Fee" placeholder="0" min="0" required>
      </div>
    </div>

    <div class="actions">
      <button type="submit" id="submitBtn"><span class="btn-label" id="submitBtnLabel">Enroll Student</span></button>
      <span class="status" id="status"></span>
    </div>
  </form>

  <div class="foot">
    <span class="partner">Progressive Physics</span>
    <span id="today"></span>
  </div>
</div>

<script>
  document.getElementById('today').textContent = new Date().toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});

  //Google Apps Script Web App URL 
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzE2iFl0bscsdJmJOdY2kQOHlpWgYLSBLg2DjGnDjkMjVTXsRDZfvqjkWa181mvqDXd/exec";

  const form = document.getElementById('studentForm');
  const status = document.getElementById('status');
  const btn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('submitBtnLabel');

  
  async function fetchWithTimeout(url, options = {}, ms = 8000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // --- subjects multi-select dropdown ---
  const subjectBtn = document.getElementById('subjectBtn');
  const subjectBtnText = document.getElementById('subjectBtnText');
  const subjectPanel = document.getElementById('subjectPanel');
  const subjectChips = document.getElementById('subjectChips');
  const subjectsHidden = document.getElementById('subjectsHidden');
  const subjectChecks = subjectPanel.querySelectorAll('input[type="checkbox"]');
  let subjects = [];

  function syncSubjects(){
    subjects = Array.from(subjectChecks).filter(c => c.checked).map(c => c.value);
    subjectsHidden.value = subjects.join(', ');
    subjectBtnText.textContent = subjects.length ? subjects.join(', ') : 'Select subjects';
    subjectBtnText.classList.toggle('placeholder', subjects.length === 0);
    subjectChips.innerHTML = '';
    subjects.forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${s} <button type="button" aria-label="remove">×</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        subjectChecks.forEach(c => { if (c.value === s) c.checked = false; });
        syncSubjects();
      });
      subjectChips.appendChild(chip);
    });
  }

  subjectChecks.forEach(c => c.addEventListener('change', syncSubjects));

  subjectBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    subjectPanel.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!document.getElementById('subjectMsel').contains(e.target)) {
      subjectPanel.classList.remove('open');
    }
  });

  syncSubjects();


  const studentIdInput = document.getElementById('studentIdInput');
  const studentIdPrefix = document.getElementById('studentIdPrefix');
  let lastSuggestedId = '';
  let studentIdFocused = false;

  studentIdInput.addEventListener('focus', () => { studentIdFocused = true; });
  studentIdInput.addEventListener('blur', () => { studentIdFocused = false; });

  let idFetchInFlight = false;

  async function fetchNextId(force){
    
    if (!force && (studentIdFocused || form.classList.contains('is-saving') || idFetchInFlight)) return;

    idFetchInFlight = true;
    studentIdPrefix.innerHTML = '<span class="spinner dark"></span>';
    studentIdInput.placeholder = 'Fetching…';
    try {
      const res = await fetchWithTimeout(`${SCRIPT_URL}?action=nextId`, {}, 8000);
      const result = await res.json();
      if (result.result === 'success' && result.id) {
        
        const untouched = force || studentIdInput.value === '' || studentIdInput.value === lastSuggestedId;
        if (untouched) studentIdInput.value = result.id;
        lastSuggestedId = result.id;
      }
    } catch (err) {
      console.error('Could not fetch next Student ID', err);
    } finally {
      studentIdPrefix.textContent = 'ID';
      studentIdInput.placeholder = 'PP 26 0001';
      idFetchInFlight = false;
    }
  }
  fetchNextId(true);
  setInterval(() => fetchNextId(false), 10000); 

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!subjects.length) {
      status.textContent = '✗ Pick at least one subject';
      status.className = 'status err';
      return;
    }

    btn.disabled = true;
    btnLabel.innerHTML = '<span class="spinner"></span>Saving';
    form.classList.add('is-saving');
    status.textContent = 'Saving…';
    status.className = 'status';

    const data = Object.fromEntries(new FormData(form).entries());
    const studentId = data['Student ID'];

    try {
      const res = await fetchWithTimeout(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      }, 15000);
      const result = await res.json();

      if (result.result === 'success') {
        status.textContent = `✓ Saved as ${result.id || studentId}`;
        status.className = 'status ok';
        form.reset();
        subjectChecks.forEach(c => c.checked = false);
        syncSubjects();
        fetchNextId(true);
      } else {
        throw new Error(result.error || 'Unknown error');
      }
    } catch (err) {
      status.textContent = '✗ Failed — check connection';
      status.className = 'status err';
      console.error(err);
    } finally {
      btn.disabled = false;
      btnLabel.textContent = 'Enroll Student';
      form.classList.remove('is-saving');
    }
  });
</script>
</body>
</html>
